services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spendora
      POSTGRES_PASSWORD: spendora_dev
      POSTGRES_DB: spendora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spendora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendora -d spendora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spendora_pgdata:
